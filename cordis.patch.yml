# blender-mcp bundle：把本地 Blender MCP 服务器接进 DSH。
#
# 需要先启动服务器（见 README）：
#   node src/server.mjs
# 默认端点 http://127.0.0.1:8765/mcp
#
# 连上后工具会以 mcp__blender__<工具名> 的形式出现，例如：
#   mcp__blender__get_scene_info
#   mcp__blender__add_primitive
#   mcp__blender__look
- insert:
    - id: mcp-blender
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: blender
        transport: streamable-http
        url: http://127.0.0.1:8765/mcp
        # Blender 建模操作（布尔、细分、渲染）可能很慢，超时给足
        toolCallTimeoutMs: 180000
        # 服务器没起来时不要让插件加载失败——这样 DSH 照常启动，
        # 用户起来服务器后重连即可
        failOnStartupError: false
        # 重连策略（实测教训，建模测试 32）：
        #   DSH 启动时服务器往往还没起（它由 ptc-model-check 的启动期监督插件拉起，
        #   或用户手动启动）。原来的 30 次 × 最长 30s 太短——服务器晚到时客户端
        #   已经放弃，之后即使服务器在线也一直 `server is disconnected`，
        #   模型就只能自己搭 socket 桥绕过插件。
        #   改成：一直重试（上限调到很大），间隔上限压到 5s，服务器一出现就接上。
        reconnect:
          enabled: true
          initialDelayMs: 500
          maxDelayMs: 5000
          maxAttempts: 100000
